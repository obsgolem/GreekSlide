<!DOCTYPE html>
<html>

<head>
    <title>{{ title }} - {{ ind+1 }}</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #content {
            max-width: 70%;
            font-size: 48pt;
            text-align: center;
            display: flex;
            flex-flow: column;
            height: 70%;
            justify-content: center;
        }

        p {
            margin: 0;
        }

        p:has(img) {
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            min-height: 0;
        }

        img {
            object-fit: contain;
            flex: 1;
            margin-left: 10px;
            margin-right: 10px;
            max-width: 90vh;
            max-height: 90vh;
            min-width: 0;
            min-height: 0;
        }

        #next {
            position: absolute;
            right: 0%;
            /* top: 50%; */
            height: 100%;
            padding-left: 10px;
            padding-right: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        #prev {
            position: absolute;
            left: 0%;
            /* top: 50%; */
            height: 100%;
            padding-left: 10px;
            padding-right: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        /* @media only screen and (max-width: 700px) {
            img {
                max-width: 15vh;
                max-height: 70vh;
            }

            #next,
            #prev {
                font-size: 32px;
            }
        } */
    </style>
    <script lang="javascript">
        {% if ind != 0 %}
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowLeft') {
                window.location.href = '{{ title }}.{{ ind-1 }}.html';
            }
        });
        {% endif %}
        {% if size - 1 != ind %}
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowRight') {
                window.location.href = '{{ title }}.{{ ind+1 }}.html';
            }
        });
        {% endif %}
    </script>
</head>

<body>
    {% if ind != 0 %}
    <a href="{{ title }}.{{ ind-1 }}.html" id="prev">Previous</a>
    {% endif %}
    <div id="content">
        {{ content|safe }}
    </div>
    {% if size-1 != ind %}
    <a href="{{ title }}.{{ ind+1 }}.html" id="next">Next</a>
    {% endif %}
</body>

</html>
