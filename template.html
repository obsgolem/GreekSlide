<!DOCTYPE html>
<html>

<head>
    <title>{{ title }} - {{ ind+1 }}</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #content {
            max-width: 70%;
            font-size: 48pt;
            text-align: center;
        }

        p {
            margin: 0;
        }

        img {
            max-width: 50vh;
            max-height: 50vh;
        }

        #next {
            position: absolute;
            right: 0%;
            /* top: 50%; */
            height: 100%;
            padding-left: 10px;
            padding-right: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #prev {
            position: absolute;
            left: 0%;
            /* top: 50%; */
            height: 100%;
            padding-left: 10px;
            padding-right: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
    <script lang="javascript">
        {% if ind != 0 %}
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowLeft') {
                window.location.href = '{{ title }}.{{ ind-1 }}.html';
            }
        });
        {% endif %}
        {% if size - 1 != ind %}
        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowRight') {
                window.location.href = '{{ title }}.{{ ind+1 }}.html';
            }
        });
        {% endif %}
    </script>
</head>

<body>
    {% if ind != 0 %}
    <a href="{{ title }}.{{ ind-1 }}.html" id="prev">Previous</a>
    {% endif %}
    <div id="content">
        {{ content|safe }}
    </div>
    {% if size-1 != ind %}
    <a href="{{ title }}.{{ ind+1 }}.html" id="next">Next</a>
    {% endif %}
</body>

</html>
