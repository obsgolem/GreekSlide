<!DOCTYPE html>
<html>

<head>
    <title>Learn Greek With Slides</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        li {
            list-style-type: none;
        }
    </style>
</head>

<body>
    <ul>
        {% for presentation in presentations %}
        <li><a href="{{ presentation.slides[0].url.name }}">{{ presentation.title }}</a></li>
        {% endfor %}
    </ul>
</body>

</html>
